<body><main class="wrap">
  <header><h1>露營冷氣用電指南</h1><p>移動冷氣是真壓縮機設備，使用前要確認營區供電、插座距離與延長線規格。</p><a class="btn" href="https://lin.ee/8maotVi">LINE 詢問營區能否使用</a></header>
  <section class="grid"><div class="card"><h2>耗電量</h2><p>移動冷氣約 425-530W，約 4-5A。</p></div><div class="card"><h2>延長線</h2><p>建議粗芯動力延長線 10-15M。</p></div><div class="card"><h2>避免跳電</h2><p>不要與電鍋、吹風機、電磁爐等高耗電設備共用同一插座。</p></div></section>
